{% extends 'base.html' %} {% block content %}

<h1>Student Details</h1>

<p>
  <strong>Name:</strong>
  {{ student.name }}
</p>

<p>
  <strong>Favourite Subject:</strong>
  {{ student.favourite_subject }}
</p>

<p>
  <strong>Birth Date:</strong>
  {{ student.birth_date }}
</p>

<p>
  <a href="{% url 'student_edit' student.pk %}"> Edit Student </a>
</p>

<p>
  <a href="{% url 'student_list' %}"> Back to Student List </a>
</p>

{% endblock %}
