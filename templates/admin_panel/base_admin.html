{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="flex gap-6">
    <!-- Sidebar -->
    <aside class="w-56 shrink-0">
        <nav class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-1 sticky top-4">
            <a href="{% url 'admin_dashboard' %}"
                class="block px-3 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'admin_dashboard' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                Dashboard
            </a>
            <a href="{% url 'category_list' %}"
                class="block px-3 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'category_list' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                Categories
            </a>
            <a href="{% url 'admin_user_list' %}"
                class="block px-3 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'admin_user_list' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                Users
            </a>
            <a href="{% url 'event_request_list' %}"
               class="flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'event_request_list' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                <span>Event Requests</span>
                {% if pending_event_count %}
                <span class="ml-2 inline-flex min-w-[1.25rem] items-center justify-center rounded-full bg-red-600 px-1.5 py-0.5 text-xs font-bold text-white">
                    {{ pending_event_count }}
                </span>
                {% endif %}
            </a>
            <a href="{% url 'analytics_dashboard' %}"
                class="block px-3 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'analytics_dashboard' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                Analytics
            </a>
            <a href="{% url 'admin_booking_list' %}"
                class="block px-3 py-2 rounded-lg text-sm font-medium {% if request.resolver_match.url_name == 'admin_booking_list' %}bg-indigo-50 text-indigo-700{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                Bookings
            </a>

        </nav>
    </aside>

    <!-- Page content -->
    <div class="flex-1 min-w-0">
        {% block admin_content %}{% endblock %}
    </div>
</div>
<script src="{% static 'js/admin_datagrid.js' %}?v=2"></script>
{% endblock %}
