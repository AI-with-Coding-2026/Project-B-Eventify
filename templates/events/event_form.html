{% extends "base.html" %}

{% block title %}{{ page_title }} | Eventify{% endblock %}

{% block content %}
<div class="container my-4">
    <h1>{{ page_title }}</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ submit_label }}</button>
    </form>

    <p><a href="{% url 'organizer_event_list' %}">Back to my events</a></p>
</div>
{% endblock %}
