{% extends "base.html" %}
{% block content %}
<div class="container my-4">
    <h1>Book: {{ event.title }}</h1>
    <p>{{ event.date }} — ${{ event.price }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Book tickets</button>
    </form>
</div>
{% endblock %}
