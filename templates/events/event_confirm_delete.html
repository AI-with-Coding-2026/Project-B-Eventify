{% extends "base.html" %}

{% block title %}
    Delete Event | Eventify
{% endblock title %}

{% block content %}
<div class="min-h-screen bg-[#f3faff] px-4 py-10 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-xl">
        <div class="rounded-2xl border border-[#dbeeff] bg-white p-6 shadow-sm sm:p-8">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#2c7be5]">Delete event</p>
            <h1 class="mt-3 text-3xl font-bold text-[#1f2937]">Delete Event</h1>

            <div class="mt-6 rounded-xl border border-[#dbeeff] bg-[#edf8ff] px-4 py-4 text-sm text-[#1d6fd6]">
                Are you sure you want to delete
                <span class="font-semibold">{{ event.title }}</span>?
            </div>

            <form method="post" class="mt-6 flex flex-col gap-3 sm:flex-row">
                {% csrf_token %}

                <button
                    type="submit"
                    class="inline-flex items-center justify-center rounded-xl bg-[#2c7be5] px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-[#1d6fd6] focus:outline-none focus:ring-4 focus:ring-[#dbeeff]"
                >
                    Yes, Delete Event
                </button>

                <a
                    href="{% url 'my_events' %}"
                    class="inline-flex items-center justify-center rounded-xl border border-[#dbeeff] bg-[#edf8ff] px-5 py-2.5 text-sm font-semibold text-[#1d6fd6] shadow-sm transition hover:bg-[#dfeeff]"
                >
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
