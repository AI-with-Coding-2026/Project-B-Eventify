{% for event in events %}
<div class="hover-lift h-full flex flex-col">
    {% include "events/partials/event_card_grid.html" with event=event %}
</div>
{% empty %}
<div class="col-span-full py-16 text-center">
    <div class="mx-auto w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-400 flex items-center justify-center mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
    </div>
    <h3 class="text-base font-semibold text-gray-900 mb-1">No upcoming events found</h3>
    <p class="text-sm text-gray-500 mb-6">Try clearing or adjusting your search filters.</p>
    <a href="{% url 'event_list' %}" class="inline-flex items-center px-4 py-2 rounded-xl text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition">
        Reset all filters
    </a>
</div>
{% endfor %}
