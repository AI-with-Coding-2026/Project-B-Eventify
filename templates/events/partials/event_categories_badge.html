<div class="inline-flex items-center gap-1 min-w-0">
    {% with cat_list=event.categories.all %}
        {% if cat_list %}
            <span class="truncate inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100/80">
                {{ cat_list.0.name }}
            </span>
            {% if cat_list|length > 1 %}
                <div class="relative inline-block group/cat-more z-30">
                    <span class="shrink-0 inline-flex items-center justify-center text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-600 text-white shadow-2xs hover:bg-indigo-700 transition cursor-pointer">
                        +{{ cat_list|length|add:"-1" }}
                    </span>
                    <!-- Animated Popover Tooltip ONLY on +N Hover -->
                    <div class="absolute left-0 top-full mt-1.5 min-w-[140px] max-w-[220px] p-2 bg-white/95 backdrop-blur-md rounded-xl shadow-xl border border-indigo-100 opacity-0 scale-95 -translate-y-1 group-hover/cat-more:opacity-100 group-hover/cat-more:scale-100 group-hover/cat-more:translate-y-0 transition-all duration-200 ease-out pointer-events-none group-hover/cat-more:pointer-events-auto z-50">
                        <p class="text-[9px] font-bold uppercase tracking-wider text-gray-400 mb-1.5 px-1">All Categories</p>
                        <div class="flex flex-wrap gap-1">
                            {% for cat in cat_list %}
                                <span class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">
                                    {{ cat.name }}
                                </span>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            {% endif %}
        {% else %}
            <span class="truncate inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">
                Uncategorized
            </span>
        {% endif %}
    {% endwith %}
</div>
