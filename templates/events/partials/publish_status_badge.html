{% if event.is_pending_publish %}
<span class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-800">Waiting for admin approval</span>
{% elif event.is_denied_publish %}
<span class="inline-flex items-center rounded-full bg-red-50 px-2.5 py-1 text-xs font-semibold text-red-700">Denied</span>
{% else %}
<span class="inline-flex items-center rounded-full bg-green-50 px-2.5 py-1 text-xs font-semibold text-green-700">Live</span>
{% endif %}
