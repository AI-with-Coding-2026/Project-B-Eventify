{% if event.is_pending_publish %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-800 border border-amber-200">
    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> Waiting for admin approval
</span>
{% elif event.is_denied_publish %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-rose-50 px-2.5 py-1 text-xs font-semibold text-rose-700 border border-rose-200">
    <span class="w-1.5 h-1.5 rounded-full bg-rose-600"></span> Denied
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700 border border-emerald-200">
    <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span> Live
</span>
{% endif %}
