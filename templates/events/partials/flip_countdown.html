<div class="flip-clock-wrapper" data-target-date="{{ target_date }}">
    {% if title %}
    <div class="text-[11px] font-semibold uppercase tracking-wider text-indigo-600 mb-1.5 text-center">
        {{ title }}
    </div>
    {% endif %}

    <div class="flip-clock-columns">
        <!-- Days Column -->
        <div class="flip-column">
            <div class="flip-card" data-unit="days">
                <div class="card-top"><span>00</span></div>
                <div class="card-bottom"><span>00</span></div>
                <div class="card-flip-top"><span>00</span></div>
                <div class="card-flip-bottom"><span>00</span></div>
            </div>
            <span class="flip-column-label">Days</span>
        </div>

        <!-- Hours Column -->
        <div class="flip-column">
            <div class="flip-card" data-unit="hours">
                <div class="card-top"><span>00</span></div>
                <div class="card-bottom"><span>00</span></div>
                <div class="card-flip-top"><span>00</span></div>
                <div class="card-flip-bottom"><span>00</span></div>
            </div>
            <span class="flip-column-label">Hours</span>
        </div>

        <!-- Minutes Column -->
        <div class="flip-column">
            <div class="flip-card" data-unit="minutes">
                <div class="card-top"><span>00</span></div>
                <div class="card-bottom"><span>00</span></div>
                <div class="card-flip-top"><span>00</span></div>
                <div class="card-flip-bottom"><span>00</span></div>
            </div>
            <span class="flip-column-label">Minutes</span>
        </div>

        <!-- Seconds Column -->
        <div class="flip-column">
            <div class="flip-card flip-card-red" data-unit="seconds" style="color: #ef4444 !important;">
                <div class="card-top"><span style="color: #ef4444 !important;">00</span></div>
                <div class="card-bottom"><span style="color: #ef4444 !important;">00</span></div>
                <div class="card-flip-top"><span style="color: #ef4444 !important;">00</span></div>
                <div class="card-flip-bottom"><span style="color: #ef4444 !important;">00</span></div>
            </div>
            <span class="flip-column-label flip-column-label-red" style="color: #ef4444 !important;">Seconds</span>
        </div>
    </div>
</div>
