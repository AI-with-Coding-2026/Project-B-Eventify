{% extends "admin_panel/base_admin.html" %}

{% block title %}Delete Category | Eventify{% endblock %}

{% block admin_content %}
<div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-red-200 max-w-2xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-gray-900 display">Delete Category</h1>

    <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-4 text-sm text-red-700">
        <p class="font-semibold mb-2">Are you sure?</p>
        <p>You are about to delete the category "<strong>{{ category.name }}</strong>". This action cannot be undone.</p>
    </div>

    <form method="post" class="flex flex-col gap-3 sm:flex-row">
        {% csrf_token %}
        <button
            type="submit"
            class="inline-flex items-center justify-center rounded-xl bg-red-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-200"
        >
            Yes, Delete Category
        </button>
        <a
            href="{% url 'category_list' %}"
            class="inline-flex items-center justify-center rounded-xl border border-indigo-100 bg-indigo-50 px-6 py-2.5 text-sm font-semibold text-indigo-700 shadow-sm transition hover:bg-indigo-100"
        >
            Cancel
        </a>
    </form>
</div>
{% endblock %}
