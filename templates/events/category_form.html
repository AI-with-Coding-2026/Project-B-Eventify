{% extends "base.html" %}

{% block title %}
    Create Category | Eventify
{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#f3faff] px-4 py-10 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-2xl">
        <div class="rounded-2xl border border-[#dbeeff] bg-white p-6 shadow-sm sm:p-8">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-[#2c7be5]">Category</p>
            <h1 class="mt-2 text-3xl font-bold text-[#1f2937]">Create Category</h1>

            {% if messages %}
                <div class="mt-5 space-y-2">
                    {% for message in messages %}
                        <p class="rounded-lg border border-[#dbeeff] bg-[#edf8ff] px-3 py-2 text-sm text-[#1d6fd6]">
                            {{ message }}
                        </p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" class="mt-6 space-y-5">
                {% csrf_token %}

                <div class="space-y-3">
                    {{ form.as_p }}
                </div>

                <div class="flex flex-col gap-3 pt-2 sm:flex-row">
                    <button
                        type="submit"
                        class="inline-flex items-center justify-center rounded-xl bg-[#2c7be5] px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-[#1d6fd6] focus:outline-none focus:ring-4 focus:ring-[#dbeeff]"
                    >
                        Save Category
                    </button>

                    <a
                        href="{% url 'event_list' %}"
                        class="inline-flex items-center justify-center rounded-xl border border-[#dbeeff] bg-[#edf8ff] px-5 py-2.5 text-sm font-semibold text-[#1d6fd6] shadow-sm transition hover:bg-[#dfeeff]"
                    >
                        Back to events
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
