<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventify Home</title>
</head>
<body>

<h1>Eventify</h1>

{% if user.is_authenticated %}
    <p>Welcome, {{ user.first_name|default:user.username }}</p>
    <p>Role: {{ user.role }}</p>

    <a href="{% url 'logout' %}">Logout</a>
{% else %}
    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'signup' %}">Sign Up</a>
{% endif %}

</body>
</html>
