{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eventify{% endblock %}</title>

    {# BLOCK: extra_head — Add meta tags, Open Graph tags, fonts, or any extra <head> content per page #}
    {% block extra_head %}{% endblock %}

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    {# BLOCK: extra_css — Add page-specific stylesheets or inline <style> tags #}
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    {# BLOCK: navbar — Override to replace or remove the default navbar #}
    {% block navbar %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Eventify</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMain"
                    aria-controls="navbarMain"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% endblock navbar %}

    {# BLOCK: page_header — Hero banners, page titles, or full-width header sections below the navbar #}
    {% block page_header %}{% endblock %}

    <!-- Main content area -->
    <main class="container my-4 flex-grow-1">

        {# BLOCK: breadcrumbs — Breadcrumb navigation for inner pages #}
        {% block breadcrumbs %}{% endblock %}

        {# BLOCK: messages — Renders Django messages as Bootstrap alerts (override for custom style) #}
        {% block messages %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% endblock messages %}

        {# BLOCK: content + sidebar — Main page content. Add a sidebar block for dashboard-style layouts #}
        <div class="row">
            <div class="{% block content_class %}col-12{% endblock %}">
                {% block content %}
                {% endblock content %}
            </div>

            {% block sidebar %}
            {% endblock sidebar %}
        </div>

    </main>

    {# BLOCK: footer — Override to customize the default footer #}
    {% block footer %}
    <footer class="bg-light text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Eventify. All rights reserved.</p>
        </div>
    </footer>
    {% endblock footer %}

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {# BLOCK: extra_js — Add page-specific JavaScript at the bottom of the body #}
    {% block extra_js %}{% endblock %}
</body>
</html>
