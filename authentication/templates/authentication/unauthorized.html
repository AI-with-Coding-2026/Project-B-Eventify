{% extends 'base.html' %}
{% block title %}Access Denied — Eventify{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-10 rounded-xl shadow mt-12 text-center">
    <div class="w-16 h-16 mx-auto mb-5 bg-red-50 rounded-full flex items-center justify-center">
        <svg class="w-8 h-8 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
    </div>
    <h1 class="text-2xl font-bold text-red-600 display mb-3">Access Denied</h1>
    <p class="text-gray-600 mb-8">You do not have permission to view this page.</p>

    {% if user.is_authenticated %}
    <a href="{% url 'event_list' %}" class="inline-block bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
        Back to Events
    </a>
    {% else %}
        <a href="{% url 'login' %}" class="inline-block bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
            Return to Login
        </a>
    {% endif %}
</div>
{% endblock %}
