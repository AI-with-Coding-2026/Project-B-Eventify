{% extends 'base.html' %}

{% block title %}Register — Eventify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Create an account</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
        </form>
    </div>
</div>
{% endblock %}
