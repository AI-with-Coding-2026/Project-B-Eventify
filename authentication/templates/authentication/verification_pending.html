{% extends 'base.html' %}

{% block title %}Verify Your Email — Eventify{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-gray-100 mt-12 text-center">
    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-xs">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-3 display">
        Check your email
    </h1>

    <p class="text-sm text-gray-600 leading-relaxed mb-6">
        We created your account successfully! Please check your inbox and click the verification link before logging in.
    </p>

    <div class="pt-4 border-t border-gray-100 flex flex-col gap-3">
        <a href="{% url 'login' %}"
           class="w-full inline-flex items-center justify-center bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-xs">
            Go to Login
        </a>
    </div>
</div>
{% endblock %}
