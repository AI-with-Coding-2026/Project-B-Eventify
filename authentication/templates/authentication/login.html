{% extends 'base.html' %}

{% block title %}
Login — Eventify
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h1 class="text-center mb-4">
                    Log in
                </h1>


                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}


                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            id="username"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Log in
                    </button>

                </form>


                <div class="text-center mt-4">

                    <p class="mb-0">
                        Don't have an account?
                        <a href="{% url 'register' %}">
                            Create an account
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
