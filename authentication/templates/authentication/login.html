{% extends 'base.html' %}
{% block title %}Log in — Eventify{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow mt-8">
    <h1 class="text-2xl font-bold mb-6 display">Log in</h1>
    <style>
        input[type="text"], input[type="password"] {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
        }
        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.2);
        }
    </style>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="username" class="block font-medium mb-1">Username</label>
            <input type="text" name="username" id="username" required>
        </div>
        <div>
            <div class="flex items-center justify-between mb-1">
                <label for="password" class="block font-medium">Password</label>
                <a href="{% url 'password_reset' %}" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">Forgot password?</a>
            </div>
            <div class="relative flex items-center">
                <input type="password" name="password" id="password" required class="w-full pr-10">
                <button type="button" id="password-toggle-btn" class="absolute right-3 text-gray-400 hover:text-gray-600 focus:outline-none transition-colors p-1 cursor-pointer" aria-label="Toggle password visibility">
                    <svg class="w-5 h-5 eye-open" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <svg class="w-5 h-5 eye-closed hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">Log in</button>
    </form>
    <p class="mt-4 text-sm">Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Register</a></p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('password-toggle-btn');
    const pwdInput = document.getElementById('password');
    if (!toggleBtn || !pwdInput) return;

    toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        
        const openIcon = toggleBtn.querySelector('.eye-open');
        const closedIcon = toggleBtn.querySelector('.eye-closed');
        if (openIcon && closedIcon) {
            openIcon.classList.toggle('hidden', isPassword);
            closedIcon.classList.toggle('hidden', !isPassword);
        }
    });
});
</script>
{% endblock %}
