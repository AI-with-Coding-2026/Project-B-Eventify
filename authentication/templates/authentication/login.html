{% extends 'base.html' %}
{% block title %}Log in — Eventify{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow mt-8">
    <h1 class="text-2xl font-bold mb-6">Log in</h1>
    {% if messages %}
        {% for message in messages %}
            <p class="text-red-600 text-sm mb-3">{{ message }}</p>
        {% endfor %}
    {% endif %}
    <style>
        input[type="text"], input[type="password"] {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
        }
        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.2);
        }
    </style>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="username" class="block font-medium mb-1">Username</label>
            <input type="text" name="username" id="username" required>
        </div>
        <div>
            <label for="password" class="block font-medium mb-1">Password</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">Log in</button>
    </form>
    <p class="mt-4 text-sm">Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Register</a></p>
</div>
{% endblock %}
