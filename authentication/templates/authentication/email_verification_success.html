{% extends 'base.html' %}

{% block title %}Email Verified — Eventify{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-gray-100 mt-12 text-center">
    <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-xs">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-3 display">
        Email Verified!
    </h1>

    <p class="text-sm text-gray-600 leading-relaxed mb-6">
        Your email address has been successfully verified. You can now log in and access your Eventify account.
    </p>

    <div class="pt-4 border-t border-gray-100">
        <a href="{% url 'login' %}"
           class="w-full inline-flex items-center justify-center bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-xs">
            Log In to Account
        </a>
    </div>
</div>
{% endblock %}
