{% extends 'base.html' %}
{% block title %}Password Reset Complete — Eventify{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow mt-8 text-center">
    <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
    </div>

    <h1 class="text-2xl font-bold display text-gray-900 mb-2">Password Reset Complete</h1>
    <p class="text-sm text-gray-600 leading-relaxed mb-6">
        Your password has been reset successfully. You can now log in to your account with your new password.
    </p>

    <a href="{% url 'login' %}" class="inline-block w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-sm">
        Log in Now
    </a>
</div>
{% endblock %}
