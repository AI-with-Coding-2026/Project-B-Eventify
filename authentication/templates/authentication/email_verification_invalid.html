{% extends 'base.html' %}

{% block title %}Invalid Verification Link — Eventify{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-2xl shadow-sm border border-gray-100 mt-12 text-center">
    <div class="w-16 h-16 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-xs">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-3 display">
        Link Expired or Invalid
    </h1>

    <p class="text-sm text-gray-600 leading-relaxed mb-6">
        This verification link is invalid or has already expired. Please register again to receive a fresh verification link.
    </p>

    <div class="pt-4 border-t border-gray-100">
        <a href="{% url 'register' %}"
           class="w-full inline-flex items-center justify-center bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-xs">
            Back to Registration
        </a>
    </div>
</div>
{% endblock %}
