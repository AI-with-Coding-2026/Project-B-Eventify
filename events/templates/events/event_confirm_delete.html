{% extends "base.html" %}
{% block title %}Delete Event — Eventify{% endblock %}
{% block content %}
<h2 class="mb-4">Delete "{{ object.title }}"?</h2>
<p>This will permanently remove the event and its poster image. This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, delete</button>
  <a href="{% url 'events:event_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
